<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Administrar tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--texto:#f2f2f2;--suave:#b5b5b5;--borde:rgba(255,255,255,.55);--borde-suave:rgba(255,255,255,.18);--verde:#25d366;--rojo:#ff6b6b}
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none!important}
  body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0b0b;color:var(--texto);min-height:100vh;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
  button,input,textarea{font-family:inherit}
  .caja{max-width:560px;margin:0 auto}
  h1{font-size:1.35rem;font-weight:600}
  h2{font-size:1.1rem;font-weight:600}
  .suave{color:var(--suave);font-size:.9rem;line-height:1.5}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:12px}

  label{display:block;font-size:.88rem;font-weight:500;margin:18px 0 6px}
  input[type=text],input[type=password],input[type=number],textarea{
    width:100%;background:#151515;color:var(--texto);border:2px solid var(--borde-suave);border-radius:14px;
    padding:13px 14px;font-size:1rem;
  }
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus{outline:0;border-color:#fff}
  :focus-visible{outline:3px solid #fff;outline-offset:3px}

  .btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;
    border-radius:16px;cursor:pointer;text-decoration:none;font:600 1rem "Poppins",system-ui,sans-serif;
    border:2px solid var(--borde);background:#000;color:var(--texto)}
  .btn.verde{background:var(--verde);border-color:var(--verde);color:#04210f}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn.chico{min-height:42px;width:auto;padding:8px 14px;font-size:.85rem;border-radius:12px;border-width:1.5px}
  .btn.peligro{color:var(--rojo);border-color:rgba(255,107,107,.6)}
  .mt{margin-top:16px}

  .error{margin-top:14px;color:var(--rojo);font-size:.9rem;line-height:1.4}

  /* Lista */
  .item{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px;margin-top:12px;
    background:#121212;border:1px solid var(--borde-suave);border-radius:20px}
  .item .mini{width:72px;height:72px;border-radius:14px;overflow:hidden;background:#262626;display:grid;place-items:center;font-weight:600;color:var(--suave);font-size:1.6rem}
  .item .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .item h3{font-size:.95rem;font-weight:500;line-height:1.3}
  .item .meta{font-size:.82rem;color:var(--suave);margin-top:2px}
  .tag{display:inline-block;background:#fff;color:#000;font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .acc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
  .vacio{text-align:center;color:var(--suave);padding:40px 10px;line-height:1.6}

  /* Fotos del formulario */
  .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .foto{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#262626}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.8);color:#fff;font-size:1.1rem;cursor:pointer;line-height:1}
  .foto .principal{position:absolute;left:6px;bottom:6px;background:#fff;color:#000;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px}
  .elegir{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;min-height:52px;border:2px dashed var(--borde);border-radius:16px;cursor:pointer;font-weight:500}
  .elegir input{position:absolute;opacity:0;width:1px;height:1px}
  .elegir:focus-within{outline:3px solid #fff;outline-offset:3px}
  .check{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:.95rem}
  .check input{width:22px;height:22px}

  .aviso{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#fff;color:#000;padding:11px 20px;border-radius:999px;font-size:.9rem;font-weight:500;transition:opacity .2s,transform .2s;z-index:10}
  .aviso.visible{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="caja">

  <!-- Entrar -->
  <section id="vistaEntrar">
    <h1>Administrar tienda</h1>
    <p class="suave" style="margin-top:8px">Escribe tu clave para subir y editar tus productos.</p>
    <form id="formEntrar">
      <label for="clave">Clave</label>
      <input type="password" id="clave" autocomplete="current-password" required>
      <label class="check" for="recordar" style="margin-top:14px"><input type="checkbox" id="recordar" checked> Recordar en este celular</label>
      <button class="btn verde mt" type="submit" id="btnEntrar">Entrar</button>
      <p class="error" id="errEntrar" role="alert" hidden></p>
    </form>
  </section>

  <!-- Lista -->
  <section id="vistaLista" hidden>
    <div class="fila">
      <h1>Mis productos</h1>
      <a class="btn chico" href="index.html" target="_blank" rel="noopener">Ver tienda</a>
    </div>
    <button class="btn verde mt" type="button" id="nuevo">+ Nuevo producto</button>
    <div id="lista"></div>
    <button class="btn-salir btn chico mt" type="button" id="salir" style="margin-top:28px">Salir</button>
  </section>

  <!-- Formulario -->
  <section id="vistaForm" hidden>
    <div class="fila">
      <h1 id="formTitulo">Nuevo producto</h1>
      <button class="btn chico" type="button" id="cancelar">Cancelar</button>
    </div>

    <label for="fFotos">Fotos</label>
    <p class="suave">La primera foto es la que se ve en la tienda. Hasta 6.</p>
    <div class="fotos" id="fotosGrid"></div>
    <label class="elegir" for="fFotos">
      <span>📷 Tomar o elegir fotos</span>
      <input type="file" id="fFotos" accept="image/*" multiple>
    </label>

    <label for="fNombre">Nombre</label>
    <input type="text" id="fNombre" maxlength="80" autocomplete="off">

    <label for="fPrecio">Precio (solo números)</label>
    <input type="text" id="fPrecio" inputmode="numeric" placeholder="Ej: 85000" autocomplete="off">

    <label for="fCategoria">Categoría</label>
    <input type="text" id="fCategoria" list="cats" maxlength="40" autocomplete="off" placeholder="Ej: Mochilas">
    <datalist id="cats"></datalist>

    <label for="fDesc">Descripción (opcional)</label>
    <textarea id="fDesc" maxlength="400"></textarea>

    <label class="check" for="fAgotado"><input type="checkbox" id="fAgotado"> Marcar como agotado</label>

    <button class="btn verde mt" type="button" id="guardar" style="margin-top:24px">Guardar producto</button>
    <p class="error" id="errForm" role="alert" hidden></p>
  </section>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const CLAVE_LS = "admin-clave-tienda";
const MAX_FOTOS = 6;
let clave = "";
let productos = [];
let ed = null; // {id, mantener:[{id,url}], nuevas:[dataUrl]}

function vista(n) {
  ["vistaEntrar", "vistaLista", "vistaForm"].forEach((v) => { $("#" + v).hidden = v !== n; });
  window.scrollTo(0, 0);
}
let timer;
function avisar(t) {
  const a = $("#aviso"); a.textContent = t; a.classList.add("visible");
  clearTimeout(timer); timer = setTimeout(() => a.classList.remove("visible"), 2200);
}

async function api(accion, extra) {
  if (!TIENDA.scriptUrl) throw new Error("Falta pegar el enlace de Apps Script en config.js (scriptUrl).");
  let r;
  try {
    r = await fetch(TIENDA.scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita bloqueos del navegador
      body: JSON.stringify(Object.assign({ clave, accion }, extra || {}))
    });
  } catch (e) {
    throw new Error("No hay conexión con la tienda. Revisa tu internet e intenta de nuevo.");
  }
  let d;
  try { d = await r.json(); } catch (e) { throw new Error("Respuesta inesperada. Revisa que Apps Script esté publicado para \"Cualquier persona\"."); }
  if (!d.ok) throw new Error(d.error || "Algo salió mal");
  productos = d.productos;
  return d;
}

/* ---------- Entrar ---------- */
async function entrar(esAuto) {
  const btn = $("#btnEntrar");
  btn.disabled = true; btn.textContent = "Entrando…";
  $("#errEntrar").hidden = true;
  try {
    await api("entrar");
    if ($("#recordar").checked) { try { localStorage.setItem(CLAVE_LS, clave); } catch (e) {} }
    pintarLista(); vista("vistaLista");
  } catch (e) {
    if (esAuto) { try { localStorage.removeItem(CLAVE_LS); } catch (x) {} }
    else { $("#errEntrar").textContent = e.message; $("#errEntrar").hidden = false; }
  } finally { btn.disabled = false; btn.textContent = "Entrar"; }
}
$("#formEntrar").addEventListener("submit", (e) => { e.preventDefault(); clave = $("#clave").value; entrar(false); });
$("#salir").addEventListener("click", () => { try { localStorage.removeItem(CLAVE_LS); } catch (e) {} clave = ""; $("#clave").value = ""; vista("vistaEntrar"); });
try { const g = localStorage.getItem(CLAVE_LS); if (g) { clave = g; entrar(true); } } catch (e) {}

/* ---------- Lista ---------- */
const precioTxt = (n) => n ? new Intl.NumberFormat("es-CO", { style: "currency", currency: TIENDA.moneda || "COP", maximumFractionDigits: 0 }).format(n) : "Sin precio";

function pintarLista() {
  const cont = $("#lista"); cont.textContent = "";
  if (!productos.length) {
    const v = document.createElement("p"); v.className = "vacio";
    v.textContent = "Todavía no tienes productos. Toca \"Nuevo producto\" para subir el primero.";
    cont.appendChild(v); return;
  }
  productos.forEach((p) => {
    const it = document.createElement("div"); it.className = "item";
    const mini = document.createElement("div"); mini.className = "mini";
    if (p.fotos[0]) {
      const im = new Image(); im.alt = ""; im.src = p.fotos[0];
      im.onerror = () => { im.remove(); mini.textContent = p.nombre.charAt(0).toUpperCase(); };
      mini.appendChild(im);
    } else mini.textContent = p.nombre.charAt(0).toUpperCase();
    const info = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = p.nombre;
    if (p.agotado) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "Agotado"; h.appendChild(t); }
    const m = document.createElement("p"); m.className = "meta";
    m.textContent = precioTxt(p.precio) + (p.categoria ? " · " + p.categoria : "");
    info.append(h, m);

    const acc = document.createElement("div"); acc.className = "acc";
    const b1 = document.createElement("button"); b1.type = "button"; b1.className = "btn chico"; b1.textContent = "Editar";
    b1.addEventListener("click", () => abrirForm(p));
    const b2 = document.createElement("button"); b2.type = "button"; b2.className = "btn chico";
    b2.textContent = p.agotado ? "Marcar disponible" : "Marcar agotado";
    b2.addEventListener("click", async () => {
      b2.disabled = true;
      try { await api("agotado", { id: p.id, valor: !p.agotado }); pintarLista(); avisar("Listo"); }
      catch (e) { b2.disabled = false; avisar(e.message); }
    });
    const b3 = document.createElement("button"); b3.type = "button"; b3.className = "btn chico peligro"; b3.textContent = "Eliminar";
    b3.addEventListener("click", async () => {
      if (!confirm("¿Eliminar \"" + p.nombre + "\"? Esto no se puede deshacer.")) return;
      b3.disabled = true;
      try { await api("borrar", { id: p.id }); pintarLista(); avisar("Producto eliminado"); }
      catch (e) { b3.disabled = false; avisar(e.message); }
    });
    acc.append(b1, b2, b3);
    it.append(mini, info, acc);
    cont.appendChild(it);
  });
}

/* ---------- Formulario ---------- */
function abrirForm(p) {
  ed = { id: p ? p.id : null, mantener: p ? p.fotoIds.map((id, i) => ({ id, url: p.fotos[i] })) : [], nuevas: [] };
  $("#formTitulo").textContent = p ? "Editar producto" : "Nuevo producto";
  $("#fNombre").value = p ? p.nombre : "";
  $("#fPrecio").value = p && p.precio ? String(p.precio) : "";
  $("#fCategoria").value = p ? p.categoria : "";
  $("#fDesc").value = p ? p.descripcion : "";
  $("#fAgotado").checked = p ? p.agotado : false;
  $("#errForm").hidden = true;
  const dl = $("#cats"); dl.textContent = "";
  [...new Set(productos.map((x) => x.categoria).filter(Boolean))].forEach((c) => { const o = document.createElement("option"); o.value = c; dl.appendChild(o); });
  pintarFotos(); vista("vistaForm");
}
$("#nuevo").addEventListener("click", () => abrirForm(null));
$("#cancelar").addEventListener("click", () => vista("vistaLista"));

function pintarFotos() {
  const g = $("#fotosGrid"); g.textContent = "";
  const todas = ed.mantener.map((f, i) => ({ src: f.url, quitar: () => ed.mantener.splice(i, 1) }))
    .concat(ed.nuevas.map((d, i) => ({ src: d, quitar: () => ed.nuevas.splice(i, 1) })));
  todas.forEach((f, i) => {
    const w = document.createElement("div"); w.className = "foto";
    const im = new Image(); im.alt = "Foto " + (i + 1); im.src = f.src; w.appendChild(im);
    if (i === 0) { const s = document.createElement("span"); s.className = "principal"; s.textContent = "Principal"; w.appendChild(s); }
    const x = document.createElement("button"); x.type = "button"; x.setAttribute("aria-label", "Quitar foto " + (i + 1)); x.textContent = "×";
    x.addEventListener("click", () => { f.quitar(); pintarFotos(); });
    w.appendChild(x); g.appendChild(w);
  });
}

/* Reduce la foto a máx. 1000 px para que suba rápido y pese poco */
function reducir(file) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const max = 1000, esc = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * esc); c.height = Math.round(im.height * esc);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No pude leer una de las fotos")); };
    im.src = url;
  });
}
$("#fFotos").addEventListener("change", async (e) => {
  const archivos = [...e.target.files];
  e.target.value = "";
  for (const f of archivos) {
    if (ed.mantener.length + ed.nuevas.length >= MAX_FOTOS) { avisar("Máximo " + MAX_FOTOS + " fotos"); break; }
    try { ed.nuevas.push(await reducir(f)); pintarFotos(); } catch (err) { avisar(err.message); }
  }
});

$("#guardar").addEventListener("click", async () => {
  const err = $("#errForm"); err.hidden = true;
  const nombre = $("#fNombre").value.trim();
  if (!nombre) { err.textContent = "Escribe el nombre del producto."; err.hidden = false; $("#fNombre").focus(); return; }
  const btn = $("#guardar");
  btn.disabled = true; btn.textContent = "Guardando… (puede tardar unos segundos)";
  try {
    await api("guardar", { producto: {
      id: ed.id,
      nombre,
      precio: $("#fPrecio").value.replace(/\D/g, ""),
      categoria: $("#fCategoria").value.trim(),
      descripcion: $("#fDesc").value.trim(),
      agotado: $("#fAgotado").checked,
      mantener: ed.mantener.map((f) => f.id),
      nuevas: ed.nuevas.map((d) => ({ data: d.split(",")[1] }))
    } });
    pintarLista(); vista("vistaLista"); avisar("Producto guardado");
  } catch (e) { err.textContent = e.message; err.hidden = false; }
  finally { btn.disabled = false; btn.textContent = "Guardar producto"; }
});
</script>
</body>
</html>
